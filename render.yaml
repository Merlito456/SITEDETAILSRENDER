services:
  - type: web
    name: sitedetailsrender
    runtime: python
    repo: https://github.com/Merlito456/SITEDETAILSRENDER
    branch: main
    buildCommand: pip install -r requirements_api.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT api:app
    envVars:
      - key: PORT
        value: 5000
